name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CIVIC_ENV: dev
  CIVIC_JWT_SECRET: test-only-jwt-secret-0123456789abcdef
  CIVIC_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:55432/civic_test
  CIVIC_DATABASE_URL_APP: postgresql+asyncpg://civic_app:civic_app@localhost:55432/civic_test
  CIVIC_APP_PASSWORD: civic_app
  CIVIC_MIGRATOR_PASSWORD: civic_migrator
  NEXT_PUBLIC_API_URL: http://localhost:8000
  CIVIC_RATE_LIMIT_REGISTRAZIONE: "100"
  CIVIC_RATE_LIMIT_LOGIN: "100"
  CIVIC_RATE_LIMIT_SEGNALAZIONI: "100"

jobs:
  test-backend:
    name: Test backend
    runs-on: ubuntu-latest
    services:
      database:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: civic_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d civic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Installa le dipendenze Python
        run: uv sync --all-packages
      - name: Applica le migrazioni
        run: cd api && uv run alembic upgrade head
      - name: Verifica lo stile con ruff
        run: uv run ruff check api
      - name: Esegue i test del backend
        run: uv run pytest

  test-frontend:
    name: Test frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Installa le dipendenze Node
        run: npm ci
      - name: Verifica i tipi
        run: npm run typecheck --workspace web
      - name: Verifica lo stile con eslint
        run: npm run lint --workspace web
      - name: Compila il frontend
        run: npm run build --workspace web

  test-e2e:
    name: Test end-to-end
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    services:
      database:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: civic_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d civic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Installa le dipendenze Python
        run: uv sync --all-packages
      - name: Installa le dipendenze Node
        run: npm ci
      - name: Applica le migrazioni
        run: cd api && uv run alembic upgrade head
      - name: Installa i browser Playwright
        run: cd web && npx playwright install --with-deps chromium
      - name: Esegue il test end-to-end
        run: npm run test:e2e --workspace web
