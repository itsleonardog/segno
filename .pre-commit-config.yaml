repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix --exit-non-zero-on-fix api
        language: system
        pass_filenames: false
      - id: black
        name: black
        entry: uv run black api
        language: system
        pass_filenames: false
      - id: prettier
        name: prettier
        entry: npm run format --workspace web
        language: system
        pass_filenames: false
      - id: eslint
        name: eslint
        entry: npm run lint --workspace web
        language: system
        pass_filenames: false
