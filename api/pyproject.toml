[project]
name = "civic-reporting-api"
version = "0.1.0"
description = "API FastAPI della piattaforma di segnalazione civica."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "asyncpg>=0.30",
    "cryptography>=43",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "httpx>=0.28",
    "PyJWT>=2.9",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn>=0.32",
]

[tool.uv]
package = false
